<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>合成预览 — l01s-water-standard HMI 原型</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#E2E8F0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; padding:20px; }
.sheet { width:2500px; }
.row { display:flex; gap:20px; margin-bottom:20px; }
.frame { position:relative; width:800px; height:480px; background:#FFFFFF; border:1px solid #CBD5E1; border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(15,23,42,.12); }

.cap { position:absolute; left:0; right:0; bottom:-26px; font-size:13px; color:#475569; text-align:center; }
.cell { position:relative; margin-bottom:30px; }
h1 { font-size:20px; color:#0F172A; margin-bottom:16px; }
</style>
</head>
<body>
<div class="sheet">
<h1>l01s-water-standard · HMI 原型合成预览（V005 批量接口 · 800×480 · 2026-11-11）</h1>
<div class="row">
  <div class="cell"><div class="frame"><iframe src="overview.html"></iframe></div><div class="cap">S1 主画面 · 运行态（overview.png）</div></div>
  <div class="cell"><div class="frame"><iframe src="overview-sleep.html"></iframe></div><div class="cap">S1 主画面 · 休眠态（overview-sleep.png）</div></div>
  <div class="cell"><div class="frame"><iframe src="params.html"></iframe></div><div class="cap">S2 参数设置 · 工程师（params.png）</div></div>
</div>
<div class="row">
  <div class="cell"><div class="frame"><iframe src="diagnostics.html"></iframe></div><div class="cap">S3 诊断与身份（diagnostics.png）</div></div>
</div>
</div>
</body>
</html>
